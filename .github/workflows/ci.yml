# Minimal macOS gate: compile every product and run unit tests.
# Intentionally skips scripts/smoke.sh and smoke-launchd.sh (longer, and
# launchd mutates the runner). Standard macos-26 arm64 only: no large /
# xlarge / intel labels (those bill more for the same work).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # `.build` PCM files bake in the checkout path (`.../work/<repo>/<repo>`),
      # so a repository rename would restore a cache compiled at the old path
      # and fail the build. The repo name is part of the key so that cannot happen.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.name }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.name }}-

      - name: Build
        run: swift build

      # make test caps how many tests run at once (Makefile, TEST_PARALLEL_WIDTH),
      # and a toolchain before Swift 6.3 ignores that cap without a word, so a
      # runner image that drops below it fails here instead of as timing flakes.
      - name: Toolchain
        run: |
          swift --version
          version=$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -1)
          read -r major minor <<< "$version"
          if [ -z "$major" ] || [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 3 ]; }; then
            echo "error: the tests need Swift 6.3 or later for the parallel-width cap; this runner has '${major:-unreadable}${minor:+.$minor}'" >&2
            echo "fix: select a newer Xcode in this workflow, e.g. sudo xcode-select -s /Applications/Xcode_26.6.app" >&2
            exit 1
          fi

      - name: Test
        run: make test
